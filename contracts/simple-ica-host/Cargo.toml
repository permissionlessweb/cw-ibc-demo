[package]
name = "simple-ica-host"
version = "0.3.0"
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
# for quicker tests, cargo test --lib

[dependencies]
simple-ica     = { path = "../../packages/simple-ica",     version = "0.3.0" }

cosmwasm-std   = { version = "3.0.0", features = ["iterator", "stargate"] }
cw-storage-plus = { version = "3.0.0" }
cw-utils       = { version = "3.0.0" }
schemars       = { version = "0.8.4" }
serde          = { version = "1.0.103", features = ["derive"], default-features = false }
thiserror      = { version = "1.0.23" }

cw1-whitelist  = { git = "https://github.com/permissionlessweb/cw-plus", features = ["library"] }

[dev-dependencies]
cosmwasm-schema = { version = "3.0.0" }