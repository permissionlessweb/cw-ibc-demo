[package]
name = "simple-ica-controller"
version = "0.3.0"
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# for quicker tests, cargo test --lib
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-std = { path = "../../../cosmwasm/packages/std", features = ["iterator", "stargate"] }
cw-storage-plus = { path = "../../../cw-storage-plus" }
cw-utils = { path = "../../../cw-minus/packages/cw-utils" }
schemars = "0.8"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
simple-ica = { path = "../../packages/simple-ica" }
thiserror = { version = "1.0.23" }

[dev-dependencies]
cosmwasm-schema = { path = "../../../cosmwasm/packages/schema" }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
