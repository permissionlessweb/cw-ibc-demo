[package]
name = "callback-capturer"
version = "0.3.0"
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
simple-ica-controller = { path = "../simple-ica-controller", features = ["library"] }
simple-ica = { path = "../../packages/simple-ica" }
cw-utils = { path = "../../../ZK/cw/zk-cw-minus/packages/cw-utils" }
cw2 = { path = "../../../ZK/cw/zk-cw-minus/packages/cw2" }
cw-storage-plus = { path = "../../../ZK/cw/zk-storage-plus" }
cosmwasm-schema = { path = "../../../ZK/cw/zk-cosmwasm/packages/schema" }
cosmwasm-std = { path = "../../../ZK/cw/zk-cosmwasm/packages/std", features = ["staking", "stargate"] }
schemars = "0.8"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.23" }

[dev-dependencies]
assert_matches = "1"
derivative = "2"
