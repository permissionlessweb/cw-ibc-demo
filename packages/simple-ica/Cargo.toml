[package]
name = "simple-ica"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp", features = ["stargate"] }
schemars      = { version = "0.8.22" }
serde         = { version = "1.0.103", features = ["derive"], default-features = false }
thiserror     = { version = "1.0.23" }

[dev-dependencies]
cosmwasm-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "mvp" }
